name: Build RataAPK Template

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_label:
        description: "Nama aplikasi"
        required: false
        default: "RataAPK"
      package_name:
        description: "Package name (com.contoh.app)"
        required: false
        default: "id.rataapk.template"
      version_name:
        description: "Version name (1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (angka)"
        required: false
        default: "1"
      config_json:
        description: "Isi rataapk-config.json (JSON, sudah di-base64)"
        required: false
        default: ""
      build_type:
        description: "Jenis build"
        required: false
        default: "debug"
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Terapkan package name & versi (build.gradle)
        run: |
          python3 - << 'PYEOF'
          import re
          path = "app/build.gradle"
          with open(path) as f:
              content = f.read()
          content = re.sub(r"namespace '.*?'", "namespace '${{ inputs.package_name }}'", content)
          content = re.sub(r'applicationId ".*?"', 'applicationId "${{ inputs.package_name }}"', content)
          content = re.sub(r"versionCode \d+", "versionCode ${{ inputs.version_code }}", content)
          content = re.sub(r'versionName ".*?"', 'versionName "${{ inputs.version_name }}"', content)
          with open(path, "w") as f:
              f.write(content)
          print("build.gradle diperbarui")
          PYEOF

      - name: Terapkan nama aplikasi (strings.xml)
        run: |
          python3 - << 'PYEOF'
          import re
          path = "app/src/main/res/values/strings.xml"
          with open(path) as f:
              content = f.read()
          content = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">${{ inputs.app_label }}</string>',
              content,
          )
          with open(path, "w") as f:
              f.write(content)
          print("strings.xml diperbarui")
          PYEOF

      - name: Masukkan website yang diupload (incoming/website.zip)
        if: hashFiles('incoming/website.zip') != ''
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          unzip -o incoming/website.zip -d app/src/main/assets/www
          echo "Website project diekstrak ke assets/www/"

      - name: Tulis rataapk-config.json
        if: inputs.config_json != ''
        run: |
          echo "${{ inputs.config_json }}" | base64 -d > app/src/main/assets/www/rataapk-config.json
          cat app/src/main/assets/www/rataapk-config.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
